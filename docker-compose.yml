services:
  postgres:
    image: postgres:16-alpine
    container_name: helpdesk_lab_postgres
    restart: "no"
    environment:
      POSTGRES_USER: lab_user
      POSTGRES_PASSWORD: lab_password
      POSTGRES_DB: helpdesk_lab
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - helpdesk_lab_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_user -d helpdesk_lab"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  helpdesk_lab_data:
